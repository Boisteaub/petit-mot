<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7F1E7">
  <title>Un petit mot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="haut">
    <span class="avatar" aria-hidden="true">✉️</span>
    <div>
      <h1 id="titre">Un petit mot</h1>
      <p id="sous-titre">Chargement…</p>
    </div>
  </header>

  <main id="fil" aria-live="polite"></main>

  <form id="saisie" hidden>
    <label for="texte" class="cache">Ton message</label>
    <textarea id="texte" rows="2" maxlength="300" placeholder="Écris ton message…"></textarea>
    <button id="envoyer" type="submit">Envoyer</button>
  </form>

  <p id="note" class="note"></p>

  <script src="chiffre.js"></script>
  <script src="page.js"></script>
</body>
</html>
